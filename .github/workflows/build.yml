name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: nolio-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: nolio-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: nolio-linux-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: nolio-linux-musl-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: nolio-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release nolio

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/nolio.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  build-android:
    name: Build Android (NDK)
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build
        run: cargo ndk -t ${{ matrix.abi }} build --release --locked

      - name: Package
        run: |
          mkdir -p nolio-android-${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/nolio nolio-android-${{ matrix.abi }}/
          cat > nolio-android-${{ matrix.abi }}/README.txt << 'EOF'
          Nolio for Android (${{ matrix.abi }})

          This is a native binary. Run it from Termux or adb shell:
            chmod +x nolio
            ./nolio

          Then open http://localhost:8787 in any browser on the device.
          The database (nolio.db) is created in the working directory.
          EOF
          tar -czf nolio-android-${{ matrix.abi }}.tar.gz nolio-android-${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: nolio-android-${{ matrix.abi }}.tar.gz
          path: nolio-android-${{ matrix.abi }}.tar.gz

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Nolio ${{ github.ref_name }}

            Self-hostable, offline-first workspace. Single binary, single SQLite file — no runtime dependencies.

            ### Downloads

            | File | Platform |
            |---|---|
            | `nolio-macos-arm64.tar.gz` | macOS (Apple Silicon) |
            | `nolio-macos-x64.tar.gz` | macOS (Intel) |
            | `nolio-linux-x64.tar.gz` | Linux (glibc) |
            | `nolio-linux-musl-x64.tar.gz` | Linux (musl/Alpine, fully static) |
            | `nolio-windows-x64.zip` | Windows x64 |
            | `nolio-android-arm64-v8a.tar.gz` | Android (arm64, via Termux/adb) |
            | `nolio-android-armeabi-v7a.tar.gz` | Android (arm32, via Termux/adb) |

            ### macOS Gatekeeper note

            The binary is unsigned. On first run, macOS may quarantine it. Remove the quarantine flag with:

            ```
            xattr -dr com.apple.quarantine nolio
            ```

            ### Quick start

            ```
            ./nolio            # macOS / Linux
            nolio.exe          # Windows
            ```

            Open http://localhost:8787 — that's the whole app. Configuration: `NOLIO_PORT`, `NOLIO_DB`.
