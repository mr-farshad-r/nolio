<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <nav class="sidebar">
    <div class="sb-top">
      <span class="sb-workspace">Nolio</span>
      <button class="sb-icon-btn" id="new-page" title="New page">＋</button>
    </div>
    <div class="sb-search"><input id="search" placeholder="Search" autocomplete="off"></div>
    <div id="favorites" class="sb-section" hidden>
      <div class="sb-section-label">Favorites</div>
      <div id="fav-tree" class="sb-tree"></div>
    </div>
    <div class="sb-section">
      <div class="sb-section-label">Private</div>
      <div id="page-tree" class="sb-tree"></div>
    </div>
  </nav>
  <main class="main" id="main">
    <div class="content" id="page-view">
      <input id="title" placeholder="Untitled" autocomplete="off">
      <div id="blocks"></div>
      <p class="empty-hint">Type <b>/</b> for commands. Tab to nest. Select text to format.</p>
    </div>
    <div class="content wide" id="db-view" hidden>
      <div class="db-head">
        <input id="db-title" placeholder="Untitled database" autocomplete="off">
        <div class="db-views">
          <button class="view-tab" data-view="table">Table</button>
          <button class="view-tab" data-view="board">Board</button>
          <button class="view-tab" data-view="list">List</button>
        </div>
      </div>
      <div id="db-body"></div>
    </div>
  </main>
</div>

<div id="slash-menu" class="menu" hidden></div>
<div id="format-bar" class="menu fmt" hidden>
  <button data-fmt="bold" title="Bold (⌘B)"><b>B</b></button>
  <button data-fmt="italic" title="Italic (⌘I)"><i>I</i></button>
  <button data-fmt="underline" title="Underline (⌘U)"><u>U</u></button>
  <button data-fmt="strikeThrough" title="Strikethrough"><s>S</s></button>
  <button data-fmt="code" title="Inline code"><code>&lt;&gt;</code></button>
</div>
<div id="cell-menu" class="menu" hidden></div>
<div id="prop-menu" class="menu" hidden></div>

<script src="app.js"></script>
</body>
</html>
