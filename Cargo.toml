[package]
name = "nolio"
version = "0.1.0"
edition = "2021"
description = "Nolio — an offline-first, self-hostable Notion-style workspace"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "nolio"
path = "src/main.rs"
